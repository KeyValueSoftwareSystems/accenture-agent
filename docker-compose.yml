services:
  backend:
    build: ./backend
    env_file: ./.env
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_BACKEND_URL: ${VITE_BACKEND_URL:-http://localhost:8000}
    ports:
      - "5173:4173"
    depends_on:
      - backend
    restart: unless-stopped